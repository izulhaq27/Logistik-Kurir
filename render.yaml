# render.yaml — Blueprint for Render.com deployment
# Run: `render blueprint apply` or link this repo in the Render dashboard.

services:
  - type: web
    name: logiparalel-backend
    runtime: node
    region: singapore
    rootDir: server-side
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false  # Set manually in Render dashboard
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
